  <!-- ─────────────────────────────────────────────
       TRACKING DIFERIDO (GTM + Google Analytics + Meta Pixel)
       Los "stubs" (dataLayer, gtag, fbq) quedan definidos desde el primer
       instante, asi que cualquier evento que ocurra antes de tiempo se encola y
       se envia apenas llegan los scripts reales: no se pierde ninguna medicion.
       Lo unico que se retrasa es la descarga de ~240 KB de Google y Meta, que
       antes competian con el HTML y el JS de la pagina y atrasaban el arranque.
       Se disparan con lo que pase primero: el usuario interactua, o el navegador
       queda ocioso despues de terminar de cargar.
       ───────────────────────────────────────────── -->
  <script>
    (function () {
      // --- Stubs: encolan los eventos hasta que lleguen los scripts reales ---
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
      window.gtag = function () { window.dataLayer.push(arguments); };
      window.gtag('js', new Date());
      window.gtag('config', 'G-7SB7D326BE');

      if (!window.fbq) {
        var n = window.fbq = function () {
          n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments);
        };
        window._fbq = n; n.push = n; n.loaded = true; n.version = '2.0'; n.queue = [];
      }

      // --- Carga diferida de los scripts reales ---
      var URLS = [
        'https://www.googletagmanager.com/gtm.js?id=GTM-TXWTND9P',
        'https://www.googletagmanager.com/gtag/js?id=G-7SB7D326BE',
        'https://connect.facebook.net/en_US/fbevents.js'
      ];
      var EVENTOS = ['scroll', 'pointerdown', 'keydown', 'touchstart'];
      var lanzado = false;

      function cargar() {
        if (lanzado) return;
        lanzado = true;
        EVENTOS.forEach(function (e) { window.removeEventListener(e, cargar); });
        window.removeEventListener('load', alTerminarDeCargar);
        URLS.forEach(function (url) {
          var s = document.createElement('script');
          s.async = true;
          s.src = url;
          document.head.appendChild(s);
        });
      }

      function alTerminarDeCargar() {
        if (window.requestIdleCallback) window.requestIdleCallback(cargar, { timeout: 3000 });
        else setTimeout(cargar, 1200);
      }

      EVENTOS.forEach(function (e) {
        window.addEventListener(e, cargar, { once: true, passive: true });
      });
      if (document.readyState === 'complete') alTerminarDeCargar();
      else window.addEventListener('load', alTerminarDeCargar);
    })();
  </script>

  <!-- Critical CSS for faster first paint -->
  <style>
    /* Inline critical CSS for faster LCP */
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #fff;
    }

    #root {
      min-height: 100vh;
    }

    .loading-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #fff;
    }

    /* Splash inicial: se pinta apenas llega el HTML, sin esperar a que se
       descargue y ejecute React. Sin esto la pantalla queda en blanco ~2 s,
       que es exactamente lo que Google mide como "First Contentful Paint".
       React lo reemplaza al montar (createRoot vacia el contenedor). */
    .splash-inicial {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #FF671D;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .splash-inicial img {
      width: 220px;
      max-width: 60vw;
      height: auto;
      background: #fff;
      border-radius: 24px;
      padding: 16px;
      box-sizing: border-box;
    }

    .splash-inicial p {
      margin: 24px 0 0;
      color: rgba(255, 255, 255, 0.9);
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #f3f3f3;
      border-top: 3px solid #FF6B35;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }
  </style>

  <!-- Register Service Worker (solo en producción, NO en desarrollo local) -->
  <script>
    if ('serviceWorker' in navigator) {
      const isLocalhost = location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.hostname.startsWith('192.168.');
      if (!isLocalhost) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('[App] Service Worker registered:', reg.scope))
            .catch(err => console.log('[App] Service Worker registration failed:', err));
        });
      } else {
        // En desarrollo: desregistrar cualquier SW existente para evitar problemas de caché
        navigator.serviceWorker.getRegistrations().then(registrations => {
          registrations.forEach(reg => {
            reg.unregister();
            console.log('[App] Service Worker unregistered (dev mode)');
          });
        });
      }
    }
  </script>

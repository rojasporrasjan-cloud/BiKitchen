[build]
  command = "npm run build"
  publish = "dist"

[functions]
  # Extended timeout for payment functions (NMI can be slow from Costa Rica)
  # Our internal AbortController fires at 24s to give a clean JSON response.
  # This 26s limit is the outer safety net.
  node_bundler = "esbuild"

# Explicit timeout for the payment function (default is 10s which is too short for BAC)
# NOTE: Netlify Free plan maxes at 10s. Netlify Pro allows up to 26s.
[functions."nmi-charge"]
  timeout = 26

# ─────────────────────────────────────────────
#  404 REALES PARA ARCHIVOS QUE NO EXISTEN
#  La regla comodín de abajo manda TODO a index.html con estado 200, que es lo
#  que necesita una app de una sola página para que funcionen las rutas. El
#  efecto secundario es que un archivo inexistente también contestaba "200 OK"
#  con la portada: así fue como /videos/hero_optimized.mp4 devolvía HTML después
#  de borrarlo. Google llama a eso "soft 404" y lo toma como señal de descuido.
#
#  Estas reglas van ANTES del comodín. Netlify sirve primero los archivos que sí
#  existen, así que un .png real se entrega normal y solo los que faltan caen
#  aquí. No se tocan las rutas sin extensión: esas las maneja React Router con
#  su propia página de "no encontrado".
# ─────────────────────────────────────────────
[[redirects]]
  from = "/*.mp4"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*.webm"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*.png"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*.jpg"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*.jpeg"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*.webp"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*.avif"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*.svg"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*.css"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*.js"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*.woff2"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*.pdf"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ─────────────────────────────────────────────
#  CACHE-CONTROL HEADERS
#  Reduce Netlify bandwidth: returning visitors
#  serve assets from browser cache (0 bytes).
# ─────────────────────────────────────────────

# Vite-built JS/CSS/font chunks have content hashes in their filenames
# (e.g. vendor-react-Abc123.js) → safe to cache for 1 year with immutable.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Icons (hashed SVGs generated at build time)
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Static images in /public/assets (logo, og-image, etc.) — 30-day cache
[[headers]]
  for = "/assets/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/assets/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/assets/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/assets/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Video e imagen poster del hero. No llevan hash en el nombre, asi que se
# cachean 30 dias (no "immutable"): si algun dia se cambia el video, los
# visitantes lo reciben sin tener que esperar un ano.
[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Root-level images
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# index.html → NEVER cache: browser must always fetch the latest deploy
# so users get new JS chunks immediately after a deploy.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"

# Service Worker → NEVER cache (SW controls its own update cycle)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"

# Offline fallback page
[[headers]]
  for = "/offline.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Web App Manifest — short TTL so icon changes propagate
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Sitemap and robots — re-check daily
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# ─────────────────────────────────────────────
#  SECURITY HEADERS (applied to all routes)
# ─────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self), payment=(self)"
    # HSTS: fuerza HTTPS por 1 año incluyendo subdominios
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Aísla la ventana de otros sitios. Se usa "allow-popups" y NO "same-origin"
    # porque el login con Google de Firebase abre un popup y "same-origin" lo
    # dejaría sin poder comunicarse con la página.
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
